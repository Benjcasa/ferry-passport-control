<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Contrôle Passagers Ferry</title>

    <link rel="stylesheet" href="style.css">

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d47a1">
</head>

<body>

    <!-- Header / Branding -->
    <header class="app-header">
        <div class="header-inner">
            <div class="header-logo">
                <span class="header-icon">⚓</span>
                <div class="header-titles">
                    <span class="header-title">Ferry Passport Control</span>
                    <span class="header-subtitle">Contrôle des passagers</span>
                </div>
            </div>
            <div class="version-badge" title="Dernière mise à jour : 16 Août 2026 — Correction noms composés, badge fixé à droite">
                <span class="version-icon">🔖</span>
                <span class="version-text">v2.3.0 — 16 Août 2026</span>
            </div>
        </div>
    </header>

    <main class="app-main">

        <!-- Section Chargement PDF -->
        <section class="card section-load">
            <div class="section-header">
                <span class="section-icon">📄</span>
                <h2 class="section-title">Chargement de la liste</h2>
            </div>
            <div class="input-group">
                <label class="file-label" for="pdfFile">
                    <span class="file-icon">📂</span>
                    <span class="file-text">Choisir un fichier PDF</span>
                    <input type="file" id="pdfFile" accept=".pdf">
                </label>
                <button id="scannerBtn" class="scanner-btn" onclick="ouvrirScanner()" title="Scanner un passeport">
                    <span>📸</span> Scanner
                </button>
            </div>
            <div id="resultat" class="load-status">
                <span class="status-icon">ℹ️</span> Aucun fichier chargé
            </div>
        </section>

        <!-- Section Statistiques -->
        <section class="card section-stats">
            <div class="section-header">
                <span class="section-icon">📊</span>
                <h2 class="section-title">Statistiques</h2>
            </div>
            <div id="stats">
                <div class="stats-grid">
                    <div class="stat-item stat-total">
                        <div class="stat-label">👥 Total</div>
                        <div class="stat-value">0</div>
                    </div>
                    <div class="stat-item stat-checked">
                        <div class="stat-label">✅ Contrôlés</div>
                        <div class="stat-value">0</div>
                    </div>
                    <div class="stat-item stat-remaining">
                        <div class="stat-label">⏳ Restants</div>
                        <div class="stat-value">0</div>
                    </div>
                    <div class="stat-item stat-cigarettes">
                        <div class="stat-label">🚬 Cartouches</div>
                        <div class="stat-value">0</div>
                    </div>
                    <div class="stat-item stat-bottles">
                        <div class="stat-label">🍾 Bouteilles</div>
                        <div class="stat-value">0</div>
                    </div>
                </div>
            </div>

            <button id="exportBtn" onclick="exporterControles()">
                📤 Exporter les contrôles
            </button>
        </section>

        <!-- Section Recherche -->
        <section class="card section-search">
            <div class="section-header">
                <span class="section-icon">🔍</span>
                <h2 class="section-title">Recherche passager</h2>
            </div>
            <div class="search-wrapper">
                <span class="search-icon-input">🔍</span>
                <input
                    id="recherche"
                    placeholder="Tapez le nom, prénom ou date de naissance">
            </div>
            <div id="resultatRecherche"></div>
        </section>

    </main>

    <!-- Modal Scanner -->
    <div id="scannerModal" class="modal" style="display:none;">
        <div class="modal-content">
            <button class="close" onclick="fermerScanner()" aria-label="Fermer">&times;</button>
            <div class="modal-header">
                <span class="section-icon">📸</span>
                <h2>Scanner Passeport</h2>
            </div>
            
            <div id="cameraContainer">
                <video id="videoElement" autoplay playsinline></video>
                <button onclick="capturerPhoto()" class="btn-capture">📸 Prendre une photo</button>
            </div>

            <div id="photoContainer" style="display:none;">
                <canvas id="photoCanvas"></canvas>
                <div class="modal-actions">
                    <button onclick="analyserPhoto()" class="btn-analyze">🔍 Analyser</button>
                    <button onclick="reprendreScan()" class="btn-retry">↻ Reprendre</button>
                </div>
            </div>

            <div id="resultatScanner" style="display:none;">
                <h3 class="results-title">Résultats trouvés :</h3>
                <div id="listeResultats"></div>
            </div>

            <div id="chargement" style="display:none;">
                <div class="loading-spinner"></div>
                <p>Analyse en cours…</p>
            </div>
        </div>
    </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.0.4/tesseract.min.js"></script>
<script src="export.js"></script>
<script src="app.js"></script>

    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("./service-worker.js")
                .then(() => console.log("Service Worker activé"))
                .catch(err => console.log(err));
        }
    </script>

</body>

</html>
